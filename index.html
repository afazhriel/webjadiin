<!doctype html>
<html lang="id" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: the Hafi Digital "H" brand mark on a TRANSPARENT canvas.
         Same path geometry as <BrandMark>, no background shape at all.
         SVG first for crispness; the PNGs are the same artwork for contexts
         that refuse SVG favicons. ?v=2 forces browsers past their very
         aggressive favicon cache after the icon was changed. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jasa Pembuatan Website untuk Bisnis | Hafi Digital</title>
    <meta name="description" content="Hafi Digital membantu bisnis tampil lebih meyakinkan lewat website company profile, landing page, dan toko online yang rapi, cepat, dan mudah dipahami calon pelanggan." />
    <link rel="canonical" href="https://hafi.digital/" />
    <!-- Open Graph -->
    <meta property="og:title" content="Jasa Pembuatan Website untuk Bisnis | Hafi Digital" />
    <meta property="og:description" content="Website company profile, landing page, dan toko online yang membantu calon pelanggan memahami dan menghubungi bisnis Anda." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hafi.digital/" />
    <meta property="og:site_name" content="Hafi Digital" />
    <meta property="og:locale" content="id_ID" />

    <meta name="twitter:title" content="Jasa Pembuatan Website untuk Bisnis | Hafi Digital" />

        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Griya Kelapa Gading, Desa Tanimulya",
          "addressLocality": "Bandung Barat",
          "postalCode": "40552"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

      }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  </head>
